name: Coleta hidrometeorológica

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: coleta-hidrometeorologica
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Coletar dados da ANA
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 5 --max-time 90 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            https://agudo-hidro-meteo.vercel.app/api/coleta-ana

      - name: Coletar dados da Plugfield
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 5 --max-time 90 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            https://agudo-hidro-meteo.vercel.app/api/coleta-plugfield
